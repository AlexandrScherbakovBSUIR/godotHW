<rect x="48" y="80" width="32" height="4" fill="#A0522D"/>
<rect x="52" y="84" width="24" height="4" fill="#A0522D"/>
<rect x="52" y="88" width="24" height="4" fill="#A0522D"/>
<!-- FEET (row 23-24) -->
<rect x="52" y="92" width="10" height="4" fill="#654321"/>
<rect x="66" y="92" width="10" height="4" fill="#654321"/>
<!-- SWORD (right side, rows 8-18) -->
<rect x="92" y="32" width="4" height="4" fill="#4169E1"/>
